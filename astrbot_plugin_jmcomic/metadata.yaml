name: astrbot_plugin_jmcomic
display_name: jm下载姬
desc: 禁漫本子一键下载插件（不完善，可能有bug）。搜索、榜单、按ID下载，长图/zip/pdf三种格式交付，任务可查可取消。依赖完全自包含，装上即用，卸载即净。v1.2.0 起上游更新改为授权式：不会自动装，查到新版先问你，看过静态审查报告才动手。依赖同样走授权式，缺了不自动装，敲 jm依赖 处理。有问题联系QQ2945386118。
help: |
  🎴 jm下载姬 · 禁漫本子下载

  搜本 <关键词> [页码]
    搜索本子，每页5条。例：搜本 无望菜志

  排行 [周/日/月]
    查看对应榜单 Top10。例：排行 周

  下本 <ID> [格式]
    下载本子。格式：长图/zip/pdf，缺省用面板默认。
    例：下本 243484 长图

  我的任务
    查看自己的下载任务和进度

  取消 <任务号>
    取消自己的任务。例：取消 1

  交付完自动清理服务器文件，不占磁盘。

  ── 授权式更新（2026-10-04 起，不再自动装）──
  敲任意命令会顺带只读查一次上游版本，有新版就在回复里提示一行

  jm更新 <无参>
    下载新版到临时目录并静态审查（不装），审查报告发给你

  jm安装 / jm强制安装
    看过报告后确认安装；审查有可疑项时 jm安装 会被拒，要装得敲 jm强制安装

  jm跳过 / jm放弃
    跳过这一版（等下次新版再问）/ 丢掉临时文件

  ── 私有依赖 curl-cffi ──
  jm依赖
    列出本机现有版本 + PyPI 可选版本（每个都带发布日期）

  jm依赖 <版本号>
    下载指定版本到临时目录并审查

  jm依赖 装 / jm依赖 放弃
    确认后装进 .deps / 丢掉临时文件

  注：插件尚不完善，遇bug请联系QQ2945386118，或让Agent排查修复。
version: v1.2.1
author: 梦璃
